    <path d="M258 268c0-34 26-56 64-56h20c38 0 60 22 60 56" fill="none" stroke="#7C5620" stroke-width="7"/>
    <circle cx="288" cy="252" r="22" fill="#D4523A"/>
    <circle cx="330" cy="244" r="19" fill="#C0432C"/>
    <circle cx="368" cy="256" r="17" fill="#D4523A"/>
    <path d="M288 230c5-7 12-9 18-6-5 7-12 9-18 6zM330 224c5-6 11-7 16-4-4 6-11 8-16 4z" fill="#5C6F2B"/>
    <g>
      <path d="M392 262l30-8c6 12 2 24-12 30l-18 4z" fill="#DE802B"/>
      <path d="M396 250c8-10 18-14 28-12-4 10-14 16-28 12z" fill="#7A8F3A"/>
      <path d="M402 274l26-10c5 10 2 20-10 25l-16 4z" fill="#C96A1E"/>
    </g>
  </g>

  <!-- fruit bowl -->
  <g>
    <path d="M424 276h116a58 58 0 0 1-116 0z" fill="#5C6F2B"/>
    <path d="M424 276h116c-6 24-30 40-58 40s-52-16-58-40z" fill="#445322"/>
    <circle cx="456" cy="262" r="18" fill="#DE802B"/>
    <circle cx="492" cy="258" r="16" fill="#E8B33A"/>
    <circle cx="518" cy="266" r="14" fill="#D4523A"/>
    <path d="M492 240c4-6 10-8 15-5-4 6-10 8-15 5z" fill="#5C6F2B"/>
  </g>

