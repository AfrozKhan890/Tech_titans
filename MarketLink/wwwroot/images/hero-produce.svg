<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 520" role="img" aria-label="Baskets of just-picked vegetables and fruit">
  <defs>
    <linearGradient id="hero-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6F0D7"/>
      <stop offset="1" stop-color="#E4EFAE"/>
    </linearGradient>
    <linearGradient id="hero-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9964E"/>
      <stop offset="1" stop-color="#9C6E33"/>
    </linearGradient>
  </defs>

  <rect width="620" height="520" rx="28" fill="url(#hero-sky)"/>
  <circle cx="492" cy="104" r="62" fill="#F0A050" opacity=".38"/>
  <circle cx="492" cy="104" r="40" fill="#DE802B" opacity=".28"/>

  <!-- rolling field -->
  <path d="M0 392c96-42 176-16 268-16s180-40 352 12v132H0z" fill="#9CAB84"/>
  <path d="M0 424c120-30 210-6 316-6s190-22 304 14v90H0z" fill="#7A8F3A"/>

  <!-- table -->
  <rect x="66" y="330" width="488" height="26" rx="9" fill="url(#hero-wood)"/>
  <rect x="98" y="356" width="20" height="96" rx="7" fill="#8A5F2A"/>
  <rect x="502" y="356" width="20" height="96" rx="7" fill="#8A5F2A"/>

  <!-- crate of greens -->
  <g>
    <path d="M86 250h132l-12 84H98z" fill="#C9964E"/>
    <path d="M86 250h132l-4 26H90z" fill="#A87526"/>
    <g stroke="#8A5F2A" stroke-width="5" stroke-linecap="round">
      <path d="M96 292h112M100 312h104"/>
