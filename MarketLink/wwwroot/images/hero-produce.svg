  <g>
    <ellipse cx="140" cy="452" rx="26" ry="10" fill="#000" opacity=".08"/>
    <path d="M124 452l34-6c6 10 2 20-10 24l-24 2z" fill="#DE802B"/>
    <path d="M130 440c10-8 22-9 32-4-8 8-22 10-32 4z" fill="#7A8F3A"/>
    <ellipse cx="470" cy="464" rx="22" ry="9" fill="#000" opacity=".08"/>
    <circle cx="462" cy="452" r="16" fill="#D4523A"/>
    <circle cx="490" cy="456" r="13" fill="#C0432C"/>
    <path d="M462 436c4-6 10-7 14-4-4 6-10 7-14 4z" fill="#5C6F2B"/>
