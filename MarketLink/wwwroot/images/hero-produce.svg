    <path d="M150 216c-2-16 4-28 16-36 4 16 0 28-16 36z" fill="#9CAB84"/>
  </g>

  <!-- basket of tomatoes and carrots -->
  <g>
    <path d="M252 268h150l-16 76a14 14 0 0 1-14 12H282a14 14 0 0 1-14-12z" fill="#B8842F"/>
    <path d="M252 268h150l-5 26H257z" fill="#96682A"/>
    <g stroke="#7C5620" stroke-width="5" stroke-linecap="round">
      <path d="M262 306h130M266 326h120"/>
