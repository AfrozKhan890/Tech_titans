  <!-- floating leaves -->
  <g fill="#D8E983" opacity=".9">
    <path d="M74 118c16-14 34-16 50-6-12 16-32 20-50 6z"/>
    <path d="M540 214c14-12 30-14 44-6-10 14-28 18-44 6z"/>
    <path d="M300 96c12-14 28-18 44-12-8 16-26 22-44 12z" opacity=".75"/>
